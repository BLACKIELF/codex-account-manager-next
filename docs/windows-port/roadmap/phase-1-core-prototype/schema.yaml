# Phase 1 架构图 schema

meta:
  title: "Phase 1：跨平台核心读取原型"
  subtitle: "命令行工具 codexu-probe：读取 Codex session JSONL，输出 LocalUsage JSON（Claude Code provider deferred）"
  updated: "2026-07-24"
  version: "0.2"
  direction: top_to_bottom

categories:
  external:
    role: "本地数据源"
    fill: "#dbeafe"
    stroke: "#3b82f6"
  core:
    role: "核心库 codexu-core"
    fill: "#d1fae5"
    stroke: "#10b981"
  cli:
    role: "命令行工具"
    fill: "#e0e7ff"
    stroke: "#6366f1"
  output:
    role: "产出"
    fill: "#fef3c7"
    stroke: "#f59e0b"

nodes:
  - id: codex_jsonl
    label: "~/.codex/archived_sessions/*.jsonl"
    category: external
    signature: "payload.timestamp · payload.type · info.last_token_usage"
    layer: top

  - id: claude_transcript
    label: "~/.claude/projects/*.jsonl"
    category: external
    signature: "message.usage · tool_use · attribution"
    layer: top
    note: "deferred: Windows 数据路径尚未出现"

  - id: cache_file
    label: "%LOCALAPPDATA%\\codexU\\codex\\session-usage-v1.json"
    category: external
    signature: "文件指纹缓存"
    shape: cylinder
    layer: top

  - id: codex_reader
    label: "CodexTranscriptReader"
    category: core
    signature: "load_local_usage()"
    note: "递归扫描 · fingerprint 缓存 · 流式解析 · payload 字段映射"
    layer: middle

  - id: claude_reader
    label: "ClaudeCodeTranscriptReader"
    category: core
    signature: "load_local_usage()"
    note: "deferred: 保留实现，待数据路径确认"
    layer: middle

  - id: common
    label: "readers::common"
    category: core
    signature: "enumerate · fingerprint · make_local_usage"
    note: "provider 无关的聚合逻辑"
    layer: middle

  - id: models
    label: "Domain Models"
    category: core
    signature: "TokenBreakdown · LocalUsage · UsageTrend"
    layer: middle

  - id: cli
    label: "codexu-probe"
    category: cli
    signature: "命令行入口 · --provider codex|claude-code"
    layer: middle

  - id: json_output
    label: "codexu-probe.json"
    category: output
    signature: "与 macOS --dump-json 兼容"
    shape: page
    layer: bottom

edges:
  - {from: codex_jsonl, to: codex_reader, kind: data_flow, label: "session JSONL"}
  - {from: claude_transcript, to: claude_reader, kind: data_flow, label: "transcript", style: dashed}
  - {from: cache_file, to: codex_reader, kind: calibration, label: "命中则跳过"}
  - {from: codex_reader, to: cache_file, kind: data_flow, label: "写入缓存"}
  - {from: codex_reader, to: common, kind: data_flow, label: "deltas"}
  - {from: claude_reader, to: common, kind: data_flow, label: "deltas", style: dashed}
  - {from: common, to: models, kind: data_flow, label: "聚合为 LocalUsage"}
  - {from: models, to: cli, kind: data_flow}
  - {from: cli, to: json_output, kind: data_flow}
