[workspace]
members = ["crates/codexu-core", "crates/codexu-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["codexU contributors"]
license = "MIT"
repository = "https://github.com/lelelelelelelelelelelelele/codexU"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "fs", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
